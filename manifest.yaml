# ============================================================================
# Environment Manifest — declarative state for a NEW machine
# ============================================================================
#
# This file describes what SHOULD EXIST on any machine I run.
# For removal/migration of legacy state, see `cleanup.yaml`.
# For the audit trail of past decisions, see `decisions.md`.
#
# Two domains:
#   1. profiles — what each profile IS (metadata) AND CONTAINS (packages),
#                 unified per Gemini's cohesion fix.
#   2. registry — HOW each package installs.
#
# Generator (lib/generate.py) parses this with strict Pydantic validation
# (lib/schema.py) and emits per-profile mise.config.<p>.toml + Brewfile.<p>.
#
# Adding a package: add to `registry:` once, then list its name in any
# profile's `packages:` list.
# ============================================================================

schema_version: "1.0"

# ============================================================================
# DOMAIN 1: PROFILES — definition + membership combined
#
# Profiles are ADDITIVE. The active set on a machine is the union of:
#   - any profile whose marker file exists
#   - any profile transitively reached via `requires:`
#
# `base` is the floor; every other profile MUST `requires: [base]` explicitly.
# Marker auto-promotion: if a marker for `work` exists, the install script
# resolves the requires chain and auto-includes `workstation` and `base`.
# ============================================================================
profiles:

  base:
    description: "True minimum: usable shell on any box (server, headless EC2, work, personal). Implicit on every machine."
    marker: null                                # always active; no file needed
    os: [mac, linux]
    requires: []
    packages:
      # Runtimes (just node + python; the bare minimum for installable scripts)
      - node
      - python
      - mise                    # installs itself; needed for the rest of mise
      # Editor (works headless)
      - neovim
      # Shell essentials
      - starship
      - atuin
      - tmux
      - zellij
      # Modern Unix (the everyday set)
      - bat
      - fd
      - ripgrep
      - fzf
      - eza
      - zoxide
      - yazi
      - btop
      - tree
      # Minimum dev tools
      - gh
      - jq
      - direnv
      # Cloud (used in scripts everywhere)
      - awscli

  workstation:
    description: "Has a screen: GUI apps + full dev toolchain. Add-on layer above base."
    marker: ~/.config/environment/profile-workstation
    os: [mac, linux]
    requires: [base]
    packages:
      # Heavier language runtimes
      - terraform
      - terragrunt
      - bun
      - go
      # Extra Unix replacements (less essential than base set)
      - sd
      - dust
      - delta
      - hyperfine
      # Dev tools (most are workstation-only)
      - just
      - lazygit
      - lefthook
      - gitleaks
      - shfmt
      - shellcheck
      - zizmor
      - tree-sitter-cli
      - lua-language-server
      - parallel
      - act
      - fastfetch
      - k6
      - typst
      - sesh
      # Python tooling
      - uv
      # Cloud (workstation only)
      - tflint
      # AI TUI
      - opencode
      # Network / misc
      - wget
      - pandoc
      - pnpm
      # Brew on mac
      - mas
      - git-lfs
      # Cross-machine GUI apps
      - maccy
      - bruno
      - disk-inventory-x
      - docker
      - ghostty
      - google-chrome
      - google-drive
      - obsidian
      - slack
      - xcode
      - cursor
      - visual-studio-code
      - zed
      - firefox
      - pgadmin4
      - font-jetbrains-mono-nerd-font
      # Bootstrappers
      - claude-code
      # Rust toolchain (mise)
      - rust
      # Zsh plugins (git-cloned)
      - zsh-autosuggestions
      - zsh-syntax-highlighting

  work:
    description: "Corporate tools for the work Mac. Requires workstation."
    marker: ~/.config/environment/profile-work
    os: [mac]
    requires: [workstation]
    packages:
      - snyk
      - oath-toolkit
      - displaylink-manager
      - falcon
      - beyondtrust
      - jamf-trust
      - privilegemanagement
      - self-service
      - microsoft-excel
      - microsoft-powerpoint
      - microsoft-teams
      - microsoft-word
      - onedrive
      - openvpn-connect
      - rippling
      - skim

  personal:
    description: "Creative and personal tools. Requires workstation."
    marker: ~/.config/environment/profile-personal
    os: [mac, linux]
    requires: [workstation]
    packages:
      - claude
      - gemini
      - adobe-acrobat-dc
      - adobe-creative-cloud
      - adobe-illustrator-2026
      - adobe-photoshop-2026

  # Future device-specific overrides — uncomment when you need divergence:
  # personal-mac-mini:
  #   description: "Personal mac mini specifically (e.g. GPU-only tools)"
  #   marker: ~/.config/environment/profile-personal-mac-mini
  #   os: [mac]
  #   requires: [personal]
  #   packages: []
  # personal-arch:
  #   description: "Personal Arch box"
  #   marker: ~/.config/environment/profile-personal-arch
  #   os: [linux]
  #   requires: [personal]
  #   packages: []
  # personal-fedora:
  #   description: "Personal Fedora box"
  #   marker: ~/.config/environment/profile-personal-fedora
  #   os: [linux]
  #   requires: [personal]
  #   packages: []

# ============================================================================
# DOMAIN 2: REGISTRY — HOW each package installs
#
# Per-package fields:
#   type:           mise | brew | cask | bootstrap | git_clone | unmanaged
#                   (REQUIRED — discriminator for the schema)
#   os:             [mac] | [linux] | [mac, linux]   (default: [mac, linux])
#   repo:           source URL (informational)
#   notes:          free-form
#
#   mise-only:
#     versions:     LIST of version strings; first = default. ALWAYS a list
#                   (Wave 1: normalized — no more `version:` scalar).
#
#   brew/cask-only:
#     tap:          brew tap (e.g., "snyk/tap")
#     linux_packages: dict of pkg-mgr → install id (cross-OS only)
#     it_managed:   true → app is installed/owned OUTSIDE brew (Jamf/MDM push,
#                   or a self-managed app already in /Applications). Kept here
#                   for visibility but EXCLUDED from the generated Brewfile,
#                   since `brew bundle` would try to sudo-adopt it and fail
#                   against the IT authorization wall.
#
#   bootstrap-only:
#     via:          install command
#     check_cmd:    shell test that exits 0 if already installed (Wave 2)
#
#   git_clone-only:
#     clone_to:     filesystem path to clone into
#     source:       file to source from .zshrc (zsh plugins only)
#     branch:       git branch to track (default: main)         (Wave 2)
#     tag:          git tag to pin                              (Wave 2)
#     commit:       git commit hash to pin                      (Wave 2)
#
#   unmanaged-only:
#     via:          freeform install method (informational)
# ============================================================================
registry:

  # ─── MISE TOOLS ─────────────────────────────────────────────────────────
  # JavaScript runtime
  node:
    type: mise
    versions: ["22.14.0"]
    repo: https://github.com/nodejs/node
  # Python interpreter (mise picks WHICH; uv handles project deps)
  python:
    type: mise
    versions: ["3.14", "3.13", "3.12", "3.11", "3.10"]
    repo: https://github.com/python/cpython
  # Infrastructure-as-code
  terraform:
    type: mise
    versions: ["latest"]
    repo: https://github.com/hashicorp/terraform
  # Multi-env Terraform wrapper
  terragrunt:
    type: mise
    versions: ["latest"]
    repo: https://github.com/gruntwork-io/terragrunt
  # Fast JS runtime + bundler
  bun:
    type: mise
    versions: ["latest"]
    repo: https://github.com/oven-sh/bun
  # Go toolchain
  go:
    type: mise
    versions: ["latest"]
    repo: https://github.com/golang/go
  # Hyperextensible Vim-based editor
  neovim:
    type: mise
    versions: ["latest"]
    repo: https://github.com/neovim/neovim

  # cat clone with syntax highlighting + git
  bat:
    type: mise
    versions: ["latest"]
    repo: https://github.com/sharkdp/bat
  # Find replacement
  fd:
    type: mise
    versions: ["latest"]
    repo: https://github.com/sharkdp/fd
  # Recursive grep that respects .gitignore
  ripgrep:
    type: mise
    versions: ["latest"]
    repo: https://github.com/BurntSushi/ripgrep
  # Fuzzy finder
  fzf:
    type: mise
    versions: ["latest"]
    repo: https://github.com/junegunn/fzf
  # ls replacement
  eza:
    type: mise
    versions: ["latest"]
    repo: https://github.com/eza-community/eza
  # Smarter cd
  zoxide:
    type: mise
    versions: ["latest"]
    repo: https://github.com/ajeetdsouza/zoxide
  # Blazing-fast TUI file manager. Integrates with fd/ripgrep/fzf/zoxide and
  # uses eza/bat for previews. mise registry → aqua:sxyazi/yazi (ships both the
  # `yazi` TUI and the `ya` CLI).
  yazi:
    type: mise
    versions: ["latest"]
    repo: https://github.com/sxyazi/yazi
  # sed alternative
  sd:
    type: mise
    versions: ["latest"]
    repo: https://github.com/chmln/sd
  # du replacement
  dust:
    type: mise
    versions: ["latest"]
    repo: https://github.com/bootandy/dust
  # Syntax-highlighted git diff viewer
  delta:
    type: mise
    versions: ["latest"]
    repo: https://github.com/dandavison/delta
  # Command-line benchmarking
  hyperfine:
    type: mise
    versions: ["latest"]
    repo: https://github.com/sharkdp/hyperfine
  # top/htop replacement. mise registry ships aarch64 ONLY for linux —
  # darwin/arm64 fails. Use brew on mac, system package on linux.
  btop:
    type: brew
    os: [mac, linux]
    repo: https://github.com/aristocratos/btop
    linux_packages:
      apt: btop
      dnf: btop
      pacman: btop
  # Directory listing in tree format. Tested mise: not in registry — flipped back to brew.
  tree:
    type: brew
    os: [mac, linux]
    repo: https://gitlab.com/OldManProgrammer/unix-tree
    linux_packages:
      apt: tree
      dnf: tree
      pacman: tree

  # GitHub CLI
  gh:
    type: mise
    versions: ["latest"]
    repo: https://github.com/cli/cli
  # JSON processor
  jq:
    type: mise
    versions: ["latest"]
    repo: https://github.com/jqlang/jq
  # Modern make alternative
  just:
    type: mise
    versions: ["latest"]
    repo: https://github.com/casey/just
  # TUI for git
  lazygit:
    type: mise
    versions: ["latest"]
    repo: https://github.com/jesseduffield/lazygit
  # Auto-loads .envrc
  direnv:
    type: mise
    versions: ["latest"]
    repo: https://github.com/direnv/direnv
  # Fast, parallel git hooks manager
  lefthook:
    type: mise
    versions: ["latest"]
    repo: https://github.com/evilmartians/lefthook
  # Secret scanner
  gitleaks:
    type: mise
    versions: ["latest"]
    repo: https://github.com/gitleaks/gitleaks
  # Shell script formatter
  shfmt:
    type: mise
    versions: ["latest"]
    repo: https://github.com/mvdan/sh
  # Shell script linter
  shellcheck:
    type: mise
    versions: ["latest"]
    repo: https://github.com/koalaman/shellcheck
  # GitHub Actions security auditor
  zizmor:
    type: mise
    versions: ["latest"]
    repo: https://github.com/woodruffw/zizmor
  # Parser generator (nvim treesitter). Tested mise: not in registry — back to brew.
  tree-sitter-cli:
    type: brew
    os: [mac]
    repo: https://github.com/tree-sitter/tree-sitter
  # Lua LSP (nvim)
  lua-language-server:
    type: mise
    versions: ["latest"]
    repo: https://github.com/LuaLS/lua-language-server
  # GNU parallel. Tested mise: not in registry — back to brew.
  parallel:
    type: brew
    os: [mac, linux]
    repo: https://www.gnu.org/software/parallel/
    linux_packages:
      apt: parallel
      dnf: parallel
      pacman: parallel
  # Smart terminal session manager (pairs with tmux/zellij). Not in mise registry.
  sesh:
    type: brew
    os: [mac, linux]
    repo: https://github.com/joshmedeski/sesh
    linux_packages:
      apt: sesh
      dnf: sesh
  # Run GitHub Actions locally
  act:
    type: mise
    versions: ["latest"]
    repo: https://github.com/nektos/act
  # System info screenshot tool
  fastfetch:
    type: mise
    versions: ["latest"]
    repo: https://github.com/fastfetch-cli/fastfetch
  # Load testing tool
  k6:
    type: mise
    versions: ["latest"]
    repo: https://github.com/grafana/k6
  # Modern markup typesetting (LaTeX alternative)
  typst:
    type: mise
    versions: ["latest"]
    repo: https://github.com/typst/typst
  # Terminal multiplexer
  tmux:
    type: mise
    versions: ["latest"]
    repo: https://github.com/tmux/tmux

  # Terminal workspace / multiplexer (Rust; alternative to tmux)
  zellij:
    type: mise
    versions: ["latest"]
    repo: https://github.com/zellij-org/zellij

  # Python project + package manager (replaces pip/venv/poetry/pipx)
  uv:
    type: mise
    versions: ["latest"]
    repo: https://github.com/astral-sh/uv

  # Cross-shell prompt
  starship:
    type: mise
    versions: ["latest"]
    repo: https://github.com/starship/starship
  # SQLite-backed shell history (manual login per machine)
  atuin:
    type: mise
    versions: ["latest"]
    repo: https://github.com/atuinsh/atuin

  # AWS CLI
  awscli:
    type: mise
    versions: ["latest"]
    repo: https://github.com/aws/aws-cli
  # Terraform linter
  tflint:
    type: mise
    versions: ["latest"]
    repo: https://github.com/terraform-linters/tflint

  # Anomalyco's opencode tool
  opencode:
    type: mise
    versions: ["latest"]
    repo: https://github.com/anomalyco/opencode
    tap: anomalyco/tap
    linux_packages:
      bash: "curl -fsSL https://opencode.ai/install | bash"

  # HTTP/FTP downloader. Tested mise: not in registry — back to brew.
  wget:
    type: brew
    os: [mac, linux]
    repo: https://www.gnu.org/software/wget/
    linux_packages:
      apt: wget
      dnf: wget
      pacman: wget

  # Universal document converter
  pandoc:
    type: mise
    versions: ["latest"]
    repo: https://github.com/jgm/pandoc
  # Fast Node package manager
  pnpm:
    type: mise
    versions: ["latest"]
    repo: https://github.com/pnpm/pnpm

  # ─── MISE: tools previously in brew but now confirmed in mise registry ──
  # Mac App Store CLI — verified `mise registry mas` returns aqua:mas-cli/mas
  mas:
    type: mise
    os: [mac]
    versions: ["latest"]
    repo: https://github.com/mas-cli/mas
  # Snyk security CLI (work) — verified `mise registry snyk` returns aqua:snyk/cli
  snyk:
    type: mise
    os: [mac, linux]
    versions: ["latest"]
    repo: https://github.com/snyk/cli
  # git-lfs — verified `mise registry git-lfs` returns aqua:git-lfs/git-lfs
  git-lfs:
    type: mise
    os: [mac, linux]
    versions: ["latest"]
    repo: https://github.com/git-lfs/git-lfs

  # ─── BREW FORMULAE ──────────────────────────────────────────────────────
  # OATH (HOTP/TOTP) toolkit — local MFA codes (work alias relies on `oathtool`)
  oath-toolkit:
    type: brew
    os: [mac, linux]
    repo: https://www.nongnu.org/oath-toolkit/
    linux_packages:
      apt: oathtool
      dnf: oath-toolkit
      pacman: oath-toolkit

  # ─── BREW CASKS (cross-platform GUI apps) ───────────────────────────────
  # macOS clipboard manager (Cmd+Shift+C → history popup). Mac-only.
  maccy:
    type: cask
    os: [mac]
    it_managed: true
    repo: https://github.com/p0deje/Maccy
  # Open-source Postman alternative
  bruno:
    type: cask
    os: [mac, linux]
    repo: https://github.com/usebruno/bruno
    linux_packages:
      flatpak: com.usebruno.Bruno
      apt: bruno
      dnf: bruno
  # Disk usage visualizer (treemap)
  disk-inventory-x:
    type: cask
    os: [mac, linux]
    repo: http://www.derlien.com/
    linux_packages:
      apt: baobab
      dnf: baobab
  # Docker Desktop / Engine
  docker:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://www.docker.com/
    linux_packages:
      apt: docker-ce
      dnf: docker-ce
      pacman: docker
  # Primary terminal
  ghostty:
    type: cask
    os: [mac, linux]
    repo: https://github.com/ghostty-org/ghostty
    linux_packages:
      flatpak: com.mitchellh.ghostty
  # Chrome browser
  google-chrome:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://www.google.com/chrome/
    linux_packages:
      apt: google-chrome-stable
      dnf: google-chrome-stable
  # Google Drive sync
  google-drive:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://www.google.com/drive/
    linux_packages:
      apt: rclone
      dnf: rclone
  # Markdown notes (Obsidian Sync)
  obsidian:
    type: cask
    os: [mac, linux]
    repo: https://obsidian.md/
    linux_packages:
      flatpak: md.obsidian.Obsidian
  # Slack desktop
  slack:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://slack.com/
    linux_packages:
      flatpak: com.slack.Slack
      snap: slack
  # Apple's IDE — NOT a brew cask. Installed via Mac App Store (`mas install 497799835`)
  # or by downloading the .xip from developer.apple.com. Tracked here for visibility only.
  xcode:
    type: unmanaged
    os: [mac]
    via: "mas install 497799835  # OR: download from developer.apple.com/xcode/"
    repo: https://developer.apple.com/xcode/
  # AI-native VS Code fork
  cursor:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://github.com/getcursor/cursor
    linux_packages:
      flatpak: com.cursor.Cursor
  # VS Code (Settings Sync)
  visual-studio-code:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://github.com/microsoft/vscode
    linux_packages:
      flatpak: com.visualstudio.code
      apt: code
  # Modern Rust-based editor
  zed:
    type: cask
    os: [mac, linux]
    repo: https://github.com/zed-industries/zed
    linux_packages:
      flatpak: dev.zed.Zed
  # Firefox
  firefox:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://www.mozilla.org/firefox/
    linux_packages:
      apt: firefox
      dnf: firefox
  # PostgreSQL GUI client
  pgadmin4:
    type: cask
    os: [mac, linux]
    it_managed: true
    repo: https://github.com/pgadmin-org/pgadmin4
    linux_packages:
      apt: pgadmin4
      dnf: pgadmin4

  # ─── BREW CASKS (mac-only, [personal] in profiles) ──────────────────────
  # Claude.app desktop client
  claude:
    type: cask
    os: [mac]
    repo: https://www.anthropic.com/
  # Google Gemini desktop
  gemini:
    type: cask
    os: [mac]
    repo: https://gemini.google.com/
  # JetBrains Mono with Nerd Font glyphs
  font-jetbrains-mono-nerd-font:
    type: cask
    os: [mac]
    repo: https://github.com/ryanoasis/nerd-fonts
  # Adobe suite
  adobe-acrobat-dc:
    type: cask
    os: [mac]
    repo: https://www.adobe.com/acrobat.html
  adobe-creative-cloud:
    type: cask
    os: [mac]
    repo: https://www.adobe.com/creativecloud.html
  adobe-illustrator-2026:
    type: cask
    os: [mac]
    repo: https://www.adobe.com/products/illustrator.html
  adobe-photoshop-2026:
    type: cask
    os: [mac]
    repo: https://www.adobe.com/products/photoshop.html

  # ─── WORK APPS — Jamf/MDM-installed, NOT homebrew-cask available ────────
  # These are pushed to the work mac by IT via Jamf Self Service. Tracked
  # here for visibility but `type: unmanaged` so brew bundle doesn't try
  # (and fail) to install them.
  # DisplayLink driver for the work docking station
  displaylink-manager:
    type: unmanaged
    os: [mac]
    via: "Jamf Self Service or download from displaylink.com"
    repo: https://www.displaylink.com/
  # CrowdStrike endpoint security
  falcon:
    type: unmanaged
    os: [mac]
    via: "Jamf-deployed (IT-managed)"
  # BeyondTrust privilege management
  beyondtrust:
    type: unmanaged
    os: [mac]
    via: "Jamf-deployed (IT-managed)"
  # Jamf MDM
  jamf-trust:
    type: unmanaged
    os: [mac]
    via: "Jamf-deployed (IT-managed)"
  privilegemanagement:
    type: unmanaged
    os: [mac]
    via: "Jamf-deployed (IT-managed)"
  self-service:
    type: unmanaged
    os: [mac]
    via: "Jamf-deployed (IT-managed)"

  # ─── BREW CASKS (mac-only, [work] in profiles) ──────────────────────────
  # Microsoft 365
  microsoft-excel:
    type: cask
    os: [mac]
    it_managed: true
  microsoft-powerpoint:
    type: cask
    os: [mac]
    it_managed: true
  microsoft-teams:
    type: cask
    os: [mac]
    it_managed: true
  microsoft-word:
    type: cask
    os: [mac]
    it_managed: true
  onedrive:
    type: cask
    os: [mac]
    it_managed: true
  # Work VPN
  openvpn-connect:
    type: cask
    os: [mac]
    it_managed: true
  # Rippling (HR/IT)
  rippling:
    type: cask
    os: [mac]
    it_managed: true
  # Work PDF reader
  skim:
    type: cask
    os: [mac]

  # ─── BOOTSTRAPPERS (curl-installed) ─────────────────────────────────────
  # Anthropic's recommended installer for auto-updates
  claude-code:
    type: bootstrap
    via: "curl -fsSL https://claude.ai/install.sh | bash"
    repo: https://docs.claude.com/claude-code
  # Cross-platform self-updating version manager
  mise:
    type: bootstrap
    via: "curl https://mise.run | sh"
    notes: "Self-updates via `mise self-update`"
  # Rust toolchain — managed by mise via its rustup backend (installs rustup +
  # cargo/rustc/clippy/rustfmt; pinned channel below). Reproducible through
  # mise.config. rust-analyzer (the LSP) is installed separately by Neovim's
  # mason (see nvim mason-tools.lua), so it is not listed here.
  rust:
    type: mise
    versions: ["stable"]
    repo: https://github.com/rust-lang/rust

  # ─── GIT CLONES (zsh plugins, etc.) ─────────────────────────────────────
  # Gray ghost text of previous commands as you type
  zsh-autosuggestions:
    type: git_clone
    repo: https://github.com/zsh-users/zsh-autosuggestions
    clone_to: ~/.config/zsh/plugins/zsh-autosuggestions
    source: ~/.config/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
  # Colors valid commands green / invalid red as you type
  zsh-syntax-highlighting:
    type: git_clone
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    clone_to: ~/.config/zsh/plugins/zsh-syntax-highlighting
    source: ~/.config/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh

