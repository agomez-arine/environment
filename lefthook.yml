# lefthook.yml — git hooks for the environment repo.
#
# Install once per clone with:  ./install-hooks   (also run by ./bootstrap)
# Skip in an emergency with:    LEFTHOOK=0 git commit ...   or   git commit -n
#
# Guard rationale: docs/decisions.md mandates that home/.config/mise/mise.lock
# is TRACKED so installs are reproducible (pinned versions + checksums). When
# you change the tool set in manifest.yaml, the lockfile must be regenerated
# (`mise lock --global`) and committed ALONGSIDE it — otherwise a fresh machine
# re-resolves "latest" and the pin is meaningless. This hook blocks a commit
# that changes the manifest's tooling without also staging the lockfile.
#
# Design note: the rule is deliberately simple — "manifest tooling changed =>
# lock must be staged in the same commit". We do NOT re-run `mise lock` inside
# the hook: that would mutate the working tree mid-commit, be slow, and give
# false "all clear" results when a tool can't be resolved offline.

pre-commit:
  parallel: true
  commands:
    mise-lock-in-sync:
      # Only run when the manifest is part of this commit.
      glob: "manifest.yaml"
      run: |
        set -euo pipefail
        MANIFEST="manifest.yaml"
        LOCK="home/.config/mise/mise.lock"

        staged="$(git diff --cached --name-only)"

        # manifest.yaml must actually be staged (glob can fire on path matches).
        printf '%s\n' "$staged" | grep -qx "$MANIFEST" || exit 0

        # If the lock is staged in the same commit, we're good — trust it.
        printf '%s\n' "$staged" | grep -qx "$LOCK" && exit 0

        # The manifest is staged but the lock is NOT. Only block if the staged
        # manifest change actually touches the TOOL SET (registry entries or a
        # profile's package list) — pure comment/doc edits don't need a relock.
        # Heuristic: look at the staged diff hunks for added/removed lines that
        # are either a registry tool key (two-space indent + name + colon) or a
        # package list item (a "- name" bullet). This is intentionally broad:
        # false positives just ask you to stage the (unchanged) lock; false
        # negatives would let drift through, which is worse.
        tooling_changed="$(
          git diff --cached -U0 -- "$MANIFEST" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -E '^[+-]( {6,}- |  [a-zA-Z0-9_.-]+:)' \
            || true
        )"

        if [ -z "$tooling_changed" ]; then
          # Manifest changed but not its tooling (e.g. comments) — allow.
          exit 0
        fi

        echo "✖ manifest.yaml tooling changed but $LOCK is not staged."
        echo
        echo "  Regenerate the lockfile and stage it in this commit:"
        echo "      mise lock --global && git add $LOCK"
        echo "  (Run ./sync first if you also want the tool installed locally.)"
        echo
        echo "  Offending staged manifest lines:"
        printf '%s\n' "$tooling_changed" | sed 's/^/      /'
        echo
        echo "  To bypass intentionally: git commit -n"
        exit 1
