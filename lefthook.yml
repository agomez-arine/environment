# Keep direct mise declarations and their resolved lock in the same commit.

pre-commit:
  commands:
    mise-lock-in-sync:
      glob: "home/.config/mise/config.toml"
      run: |
        set -euo pipefail
        CONFIG="home/.config/mise/config.toml"
        LOCK="home/.config/mise/mise.lock"
        staged="$(git diff --cached --name-only)"

        printf '%s\n' "$staged" | grep -qx "$CONFIG" || exit 0
        printf '%s\n' "$staged" | grep -qx "$LOCK" && exit 0

        echo "mise config changed but $LOCK is not staged."
        echo "Run: mise lock --global && git add $LOCK"
        exit 1
