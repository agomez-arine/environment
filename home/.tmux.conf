# -----------------------------------------------------------------------------
# Basic behavior
# -----------------------------------------------------------------------------

# Allow scrolling, pane selection, and resizing with the mouse.
set -g mouse on

# Keep a large scrollback history so you can review older terminal output.
set -g history-limit 100000

# Start window numbering at 1 instead of 0.
set -g base-index 1

# Start pane numbering at 1 instead of 0.
setw -g pane-base-index 1

# Renumber windows after one is closed so numbering stays compact.
set -g renumber-windows on

# Let tmux integrate with the system clipboard when supported.
set -g set-clipboard on

# Tell applications inside tmux which terminal features to expect.
# `tmux-256color` is the modern default for tmux itself.
set -g default-terminal "tmux-256color"

# Advertise truecolor/RGB support to Ghostty and other xterm-compatible clients.
set -as terminal-features 'xterm*:RGB'

# Enable extended keys for Shift+Enter support in TUI apps (Claude Code, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let programs inside tmux send raw terminal escape sequences straight through
# to the outer terminal. Required for the Kitty graphics protocol used by
# snacks.nvim (inline image previews) and pdfreader.nvim (PDF page previews)
# under Ghostty. Without this, tmux swallows the graphics escapes and nothing
# renders. Safe to leave on generally.
set -g allow-passthrough on

# Match upstream's responsive terminal and process-environment behavior.
set -s escape-time 10
set -g focus-events on
setw -g aggressive-resize off
set -ag update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR DISPLAY SSH_AUTH_SOCK'


# -----------------------------------------------------------------------------
# Prefix key
# -----------------------------------------------------------------------------

# Remove tmux's default prefix of Ctrl-b.
unbind C-b

# Use Ctrl-Space as the prefix key (matches nvim leader key feel).
set -g prefix C-Space

# Pressing Ctrl-Space twice sends a literal Ctrl-Space through to the program inside tmux.
bind C-Space send-prefix


# -----------------------------------------------------------------------------
# Copy mode / key style
# -----------------------------------------------------------------------------

# Use Vim-style keys in command and copy modes.
set -g status-keys vi
setw -g mode-keys vi


# -----------------------------------------------------------------------------
# Reloading config
# -----------------------------------------------------------------------------

# Reload ~/.tmux.conf without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"


# -----------------------------------------------------------------------------
# Window and pane creation
# -----------------------------------------------------------------------------

# Open a new window in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"

# Split horizontally in the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"

# Split vertically in the current pane's working directory.
bind - split-window -v -c "#{pane_current_path}"

# Resize panes in repeatable five-cell increments.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# -----------------------------------------------------------------------------
# Session management
# -----------------------------------------------------------------------------
#
# sesh — smart session manager (fzf + zoxide). Installed via brew (manifest).
#   prefix + s  → fuzzy session/zoxide/tmuxinator picker in a popup.
# Requires: sesh, fzf, zoxide (all managed by the environment repo).
# NOTE: uses fzf's built-in `--tmux` popup (fzf ≥0.53) instead of the separate
# `fzf-tmux` wrapper script. The mise fzf install ships only the `fzf` binary
# (no `fzf-tmux`), so the old `fzf-tmux -p` call failed silently and the picker
# never appeared. `--tmux center,80%,70%` reproduces the old `-p 80%,70%`.
bind-key s run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux center,80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '^a all  ^t tmux  ^x zoxide' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)'
)\""


# -----------------------------------------------------------------------------
# Pane navigation
# -----------------------------------------------------------------------------

# Smart Ctrl+h/j/k/l pane navigation — no prefix needed.
# If the active pane is running nvim or fzf, the key is sent through to that
# program instead of switching panes.  This means Ctrl+h/j/k/l work for both
# tmux pane switching and Neovim window navigation without any remapping on
# the nvim side.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'


# -----------------------------------------------------------------------------
# Copy mode helpers
# -----------------------------------------------------------------------------

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Dragging while scrolled up preserves the selection; dragging on the live
# screen copies and returns control to the shell.
bind-key -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-selection-no-clear \; \
    if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'

bind-key -T copy-mode-vi DoubleClick1Pane \
    send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane \
    send-keys -X select-line \; send-keys -X copy-selection-and-cancel

bind-key -T root DoubleClick1Pane \
    select-pane -t = \; \
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' \
        'copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel'

bind-key -T root TripleClick1Pane \
    select-pane -t = \; \
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' \
        'copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel'

bind-key -T copy-mode-vi MouseDown1Pane \
    select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseUp1Pane send-keys -X cancel

bind-key -T copy-mode-vi WheelDownPane \
    send-keys -X -N 3 scroll-down \; \
    if-shell -F '#{==:#{scroll_position},0}' 'send-keys -X cancel'

set-hook -g after-select-window 'if-shell -F "#{pane_in_mode}" "send-keys -X cancel"'


# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
#
# tmux-power provides the theme; community plugins provide the live widgets.
set -g status-interval 5


# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#
# IMPORTANT (data-loss guard): continuum will happily auto-save an *empty*
# fresh-start over your good snapshot and repoint resurrect's `last` symlink at
# it — after which a restore brings back nothing. The post-save hook below runs
# after every save; if the snapshot just written is near-empty, it repoints
# `last` back to the most recent snapshot that actually has sessions. This makes
# session loss after a kill-server/empty-start effectively impossible.
# Resurrect snapshots live in: ~/.local/share/tmux/resurrect/ (XDG path).
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/resurrect-keep-best.sh'

# ---- Theme: tmux-gruvbox (currently DISABLED — using tmux-power below) -------
# Modes: dark | light | dark256 | light256
# After editing: prefix + I to install, then prefix + r / reload.
#
# LOAD ORDER MATTERS: the theme is declared BEFORE the widget plugins below.
# gruvbox writes status-left/right (including the #{cpu_percentage},
# #{battery_icon}, #{online_status} tokens we embed in section X). The widget
# plugins then run afterwards and rewrite those tokens into live shell
# substitutions. If the widgets loaded first, the tokens wouldn't exist yet
# and would render as empty.
#
# To switch BACK to gruvbox: uncomment this block and comment out the
# tmux-power block below, then `prefix + I` and `prefix + r`.
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark'           # dark | light | dark256 | light256
#
# # ---- Right-side status sections (gruvbox sections X / Y / Z) ---------------
# # Gruvbox splits the right status into three labelled sections:
# #   X = weather + CPU/RAM + battery + online (the "interesting stuff")
# #   Y = day + clock (HH:MM)
# #   Z = hostname
# set -g @tmux-gruvbox-right-status-x ' 󰍛 #{cpu_percentage} 󰾆 #{ram_percentage} | #{battery_icon} #{battery_percentage} | #{online_status} '
# set -g @tmux-gruvbox-right-status-y '%a %H:%M'
# set -g @tmux-gruvbox-right-status-z '#h'

# ---- Theme: tmux-power (ACTIVE) — everforest --------------------------------
# Powerline-style theme with a section-based model. Left sections run a→d
# (outer→inner), right sections run w→z (inner→outer). Each section accepts any
# tmux format string, including widget tokens (#{cpu_percentage}, #{battery_*},
# #{online_status}) and shell calls (#(cmd)).
#
# LOAD ORDER: per tmux-power docs, plugins that post-process status-right (like
# tmux-battery) must load AFTER tmux-power. Our widget plugins are declared
# after this block, so that holds.
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'everforest'  # gold|everforest|moon|coral|snow|forest|violet|redwine|sky
set -g @tmux_power_status_interval 5

# Powerline separators (Nerd Font).
set -g @tmux_power_right_arrow_icon ''
set -g @tmux_power_left_arrow_icon  ''

# Left side: session name only (user@host moved to the right side).
# left_b is explicitly emptied so a stale value can't linger on reload.
set -g @tmux_power_left_a ' #S'
set -g @tmux_power_left_b ''

# Right side (inner→outer; w is leftmost, z is outermost/rightmost):
#   W = CPU/RAM
#   X = battery + online status
#   Y = day + time + date (all the clock stuff grouped together)
#   Z = user@host (outermost)
# Width-aware right side: on narrow clients (laptop) the heavy widgets collapse
# so the bar doesn't get squished; on wide clients (external monitor) you get the
# full thing. The check is `#{?#{>:#{client_width},180}, full, compact}` and is
# re-evaluated on every status refresh (status-interval, 5s), so it updates when
# you detach from the monitor and reattach on the laptop. Tune 180 if your
# laptop is wider/narrower than expected (laptop ~120-160, ultrawide 200+).
#
#   W = CPU/RAM             → wide only (empty when narrow)
#   X = battery + online    → always (compact, useful on laptop)
#   Y = day/time/date       → full "%a %H:%M · %F" when wide, just "%H:%M" narrow
#   Z = user@host           → always
set -g @tmux_power_right_w '#{?#{>:#{client_width},180}, 󰍛 #{cpu_percentage} 󰾆 #{ram_percentage},}'
set -g @tmux_power_right_x ' #{battery_icon} #{battery_percentage} #{online_status}'
set -g @tmux_power_right_y '#{?#{>:#{client_width},180}, %a %H:%M  ·  %F, %H:%M}'
set -g @tmux_power_right_z ' #{USER}@#h'

# ---- Status-bar widgets -----------------------------------------------------
# These plugins expose format interpolations (e.g. #{cpu_percentage},
# #{battery_icon}, #{online_status}) that the active theme above embeds into
# the status bar. They MUST be declared AFTER the theme so they can rewrite the
# tokens the theme placed into status-right (true for both tmux-power and
# tmux-gruvbox).
set -g @plugin 'tmux-plugins/tmux-cpu'             # #{cpu_percentage} #{ram_percentage}
set -g @plugin 'tmux-plugins/tmux-battery'         # #{battery_icon} #{battery_percentage}
set -g @plugin 'tmux-plugins/tmux-online-status'   # #{online_status}

# Battery widget glyphs (Nerd Font icons; falls back to text if unsupported).
set -g @batt_icon_status_charged '󰂄'
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_discharging '󰁾'
set -g @batt_icon_status_attached '󰚥'
set -g @batt_icon_status_unknown '󰚥'

# Online-status indicator glyphs (Nerd Font network/globe).
#   online  = 󰖟 nf-md-web        (U+F059F)  green
#   offline = 󰞐 nf-md-web_off    (U+F0790)  red
# IMPORTANT: tmux-online-status defaults to the green-check emoji ✅ on macOS
# when @online_icon is unset/stale, which is why it can look like a checkmark.
# These options override that. Alternative network pair if you prefer it:
#   set -g @online_icon  '#[fg=#a7c080]󰀂#[default]'   # access-point-network
#   set -g @offline_icon '#[fg=#e67e80]󰯡#[default]'   # access-point-network-off
set -g @online_icon '#[fg=#a7c080]󰖟#[default]'
set -g @offline_icon '#[fg=#e67e80]󰞐#[default]'

# Continuum loads after the theme and widgets so its autosave hook survives
# their status-right rewrites.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- Alternative theme engines (fallbacks) ----------------------------------
# Two themes are wired up above: tmux-power (active) and tmux-gruvbox (commented
# out). To swap between them, toggle which block is commented, then `prefix + I`
# to install and `prefix + r` to reload. One more option below:
#
# uhs-robert/tmux-oasis — matches oasis.nvim (desert-inspired):
# set -g @plugin 'uhs-robert/tmux-oasis'
# set -g @oasis_flavor 'dune_dark'    # *_dark / *_light_1..5 ; see oasis docs
# set -g @oasis_mode_format 'full'    # short | full | icon | custom

# Initialize TPM after all plugin declarations.
run '~/.tmux/plugins/tpm/tpm'

# tmux 3.7 needs an explicit fill or window tabs bleed through prompts.
set -g message-style 'fg=#a7c080,bg=#262626,fill=#262626'
set -g message-command-style 'fg=#a7c080,bg=#262626,fill=#262626'
