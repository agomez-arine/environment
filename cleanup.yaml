# ============================================================================
# Cleanup Manifest — one-shot migration state
# ============================================================================
#
# This file is for things you only do ONCE (when migrating an existing
# machine), not steady-state. Steady-state divergence is handled by:
#   - ./verify   shows what's installed but NOT in manifest (orphans)
#                shows what's in manifest but NOT installed (missing)
#                shows duplicates between brew/mise
#   - ./nuke     removes anything not in manifest (executes orphans cleanup)
#
# So this file no longer carries the per-package "drop everything mise
# duplicates" lists — `nuke` figures that out from the manifest.
#
# What stays here:
#   1. Filesystem reclaim (cleanup:) — paths to nuke that aren't packages.
#      e.g., ~/Downloads/old-conference.zip, ~/.cache, screen recordings.
#      Run as a one-shot cleanup pass during migration.
#   2. Drops of things that are no longer in any package manager but were
#      installed manually (e.g., random apps in /Applications/).
# ============================================================================

schema_version: "1.0"

# ============================================================================
# DROP — packages declared as removed (one-shot migration list)
#
# Most package removal should happen via `./nuke`. The drop list is for
# packages you specifically want to call out as "removed" with a reason —
# e.g., for documentation, for an audit trail, or because the package isn't
# something nuke can detect (e.g., installed manually outside brew/mise).
# ============================================================================
drop:
  # things that pre-existed the migration and should never come back
  - name: oh-my-posh
    category: superseded
    reason: starship replaces
  - name: pre-commit
    category: superseded
    reason: lefthook replaces
  - name: pipx
    category: superseded
    reason: uvx replaces
  - name: pyenv
    category: redundant_version_manager
    reason: mise replaces
  - name: tfenv
    category: redundant_version_manager
    reason: mise replaces
  - name: tgenv
    category: redundant_version_manager
    reason: mise replaces
  - name: nvm
    category: redundant_version_manager
    reason: "mise replaces. nvm isn't a brew package; ~/.nvm is the dir to nuke."
  - name: iterm2
    category: gui_redundancy
    reason: Ghostty is primary
  - name: github-desktop
    category: gui_redundancy
    reason: gh + lazygit replaces

# ============================================================================
# CLEANUP — filesystem paths/commands to reclaim space
#
# Same as before. These are non-package state: caches, downloads, stale
# editor state, etc. Run as part of migration, not steady-state.
# ============================================================================
cleanup:
  # ─── safe nukes (caches, regenerate on demand) ──────────────────────────
  - action: nuke
    category: caches
    path: ~/.cache
    os: [mac]
    reclaim: 9.6GB
  - action: nuke
    category: caches
    path: ~/Library/Caches
    os: [mac]
    reclaim: 19GB
  - action: nuke
    category: caches
    path: ~/Library/Logs
    os: [mac]
    reclaim: 1.2GB

  # ─── stale dev environments (post-migration leftovers) ──────────────────
  - action: nuke
    category: stale_dev
    path: ~/.nvm
    reclaim: ~900MB
    notes: "Full nvm removal. mise replaces."
  - action: nuke
    category: stale_dev
    path: ~/.haystack-editor
    profiles: [work]
    reclaim: 844MB
  - action: nuke
    category: stale_dev
    path: ~/.cursor/Cache
    reclaim: ~50MB
  - action: nuke
    category: stale_dev
    path: ~/.vscode/extensions/.obsolete
    reclaim: ~20MB
  - action: review
    category: stale_dev
    path: ~/.yarn
    reclaim: 1.2GB
    notes: "Confirm migration to pnpm before nuking"

  # ─── home dir cruft (random screenshots) ────────────────────────────────
  - action: nuke
    category: home_dir
    path: ~/ssi-row-highlight.png
  - action: nuke
    category: home_dir
    path: ~/ssi-required-aligned.png
  - action: nuke
    category: home_dir
    path: ~/ssi-no-hscroll.png
  - action: nuke
    category: home_dir
    path: ~/ssi-counter.png
  - action: nuke
    category: home_dir
    path: ~/ssi-flush-final.png
  - action: nuke
    category: home_dir
    path: ~/ssi-rows-flush.png

  # ─── shell config leftovers ─────────────────────────────────────────────
  - action: review
    category: shell_files
    path: ~/.bash_profile
    profiles: [work]
    notes: "Owned by root; likely IT setup. You use zsh."
  - action: review
    category: shell_files
    path: ~/.zshrc.local
    notes: "Old per-machine zshrc overlay. Migrated to ~/environment/local/zshrc.local. Safe to nuke after verifying."

  # ─── iterm2 leftovers (the .app needs Finder drag-to-trash on managed mac) ─
  - action: nuke
    category: stale_dev
    path: ~/Library/Preferences/com.googlecode.iterm2.plist
    os: [mac]
  - action: nuke
    category: stale_dev
    path: ~/Library/Application Support/iTerm2
    os: [mac]
  - action: nuke
    category: stale_dev
    path: ~/Library/Saved Application State/com.googlecode.iterm2.savedState
    os: [mac]

  # ─── conda remnants ─────────────────────────────────────────────────────
  - action: review
    category: stale_dev
    path: ~/.conda
    notes: "Just metadata; safe nuke if fully off conda"

  # ─── brew built-in cleanup ──────────────────────────────────────────────
  - action: command
    category: brew_native
    cmd: "brew cleanup -s --prune=all"
    os: [mac]
    reclaim: 1-2GB
  - action: command
    category: brew_native
    cmd: "brew autoremove"
    os: [mac]

  # ─── library deep — manual review only (54GB+38GB potential) ────────────
  - action: review
    category: library_deep
    path: ~/Library/Containers
    os: [mac]
    reclaim: 54GB-potential
    notes: |
      Per-app sandbox data. Manually review:
        du -sh ~/Library/Containers/* | sort -hr | head -30
      Nuke containers for apps you no longer have.
  - action: review
    category: library_deep
    path: ~/Library/Application Support
    os: [mac]
    reclaim: 38GB-potential
    notes: |
      Per-app data. Manually review:
        du -sh ~/Library/Application\ Support/* | sort -hr | head -30
